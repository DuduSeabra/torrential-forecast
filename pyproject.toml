[project]
name = "petropolis-nowcast"
version = "0.1.0"
description = "Nowcasting de chuvas torrenciais em Petrópolis/RJ"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "matplotlib",
    "jupyterlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petropolis_nowcast"]
